<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP4 - Gestion des Commandes</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container py-4">
        <h1 class="mb-4 text-center text-primary font-weight-bold">Tableau de Bord des Commandes</h1>

        <!-- Zone d'affichage des erreurs de chargement -->
        <div id="error-container"></div>

        <!-- Section 1 : Indicateurs généraux -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card text-white bg-primary mb-3 text-center">
                    <div class="card-body">
                        <h6 class="card-title">Clients</h6>
                        <h3 id="total-customers" class="display-6">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info mb-3 text-center">
                    <div class="card-body">
                        <h6 class="card-title">Produits</h6>
                        <h3 id="total-products" class="display-6">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning mb-3 text-center text-dark">
                    <div class="card-body">
                        <h6 class="card-title">Commandes</h6>
                        <h3 id="total-orders" class="display-6">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success mb-3 text-center">
                    <div class="card-body">
                        <h6 class="card-title">Chiffre d'Affaires Total</h6>
                        <h3 id="total-revenue" class="display-6">0 MAD</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section 2 : Barre de recherche et Filtres -->
        <div class="card p-3 mb-4 shadow-sm">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="search-input" class="form-label">Rechercher un client</label>
                    <input type="text" id="search-input" class="form-control" placeholder="Entrez le nom du client...">
                </div>
                <div class="col-md-4">
                    <label for="status-filter" class="form-label">Filtrer par statut</label>
                    <select id="status-filter" class="form-select">
                        <option value="Tous">Tous les statuts</option>
                        <option value="Livree">Livrée</option>
                        <option value="En attente">En attente</option>
                        <option value="Annulee">Annulée</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="category-filter" class="form-label">Filtrer par catégorie produit</label>
                    <select id="category-filter" class="form-select">
                        <option value="Tous">Toutes les catégories</option>
                        <option value="Informatique">Informatique</option>
                        <option value="Accessoires">Accessoires</option>
                        <option value="Bureautique">Bureautique</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Section 3 : Liste des cartes de commandes -->
        <h4 class="mb-3">Liste des Commandes</h4>
        <div id="orders-container" class="row">
            <!-- Les cartes de commandes seront insérées ici dynamiquement par JS -->
        </div>
    </div>

    <!-- Script principal (Notez le type="module" obligatoire pour utiliser import/export) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
